name: reusable-docs

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string

      output-repository:
        required: true
        type: string

      output-branch:
        required: false
        type: string
        default: gh-pages

      # Generally `dev` or `X.Y.Z`
      deployment-version:
        required: false
        type: string
        default: generated-docs

      erase-existing-output:
        required: false
        type: boolean
        default: false

      additional-dir-to-deploy:
        required: false
        type: string
        default: ""

      deploy-as-hub:
        required: false
        type: boolean
        default: false

    secrets:
      ghcr-token:
        required: true

      push-token:
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker pull ${{ inputs.image }}

      - run: mkdir -p generated-docs

      - run: |
          docker run --rm \
            -v ${{ github.workspace }}:/src \
            -v ${{ github.workspace }}/generated-docs:/docs \
            -e ADDITIONAL_DIRECTORIES_TO_OUTPUT="${{ inputs.additional-dir-to-deploy }}" \
            ${{ inputs.image }}

      - run: |
          if [ -f "generated-docs/manifest.json" ]; then
            mv generated-docs/manifest.json manifest.json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: generated-docs

  publish:
    needs: build

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    concurrency:
      group: docs-publish-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.output-repository }}
          token: ${{ secrets.push-token }}
          path: output-repository
          fetch-depth: '0'

      - run: |
          cd output-repository
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd ..

      - name: Prepare output branch
        run: |
          cd output-repository

          if git ls-remote --exit-code --heads origin "${{ inputs.output-branch }}"; then
              echo "Branch exists"
              git checkout "${{ inputs.output-branch }}"
              git pull origin "${{ inputs.output-branch }}"
          else
              echo "Branch does not exist, creating it"
              git checkout --orphan "${{ inputs.output-branch }}"
              git rm -rf . || true
              echo "# Documentation" > README.md
              git add README.md
              git commit -m "Initialize documentation branch"
              git push origin "${{ inputs.output-branch }}"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: docs
          path: generated-docs

      - uses: actions/download-artifact@v4
        with:
          name: manifest
          path: manifest

      - run: |
          repo_name=$(basename $GITHUB_REPOSITORY)
          
          if [ "${{ inputs.deploy-as-hub }}" = "false" ]; then
            output_path=output-repository/$repo_name/${{ inputs.deployment-version }}
          else
            output_path=output-repository/hub
          fi
          
          echo "Publishing docs to: $output_path"
          
          if [ -d "$output_path" ] && [ "${{ inputs.erase-existing-output }}" = "true" ]; then
            if [[ "$output_path" == output-repository/* ]]; then
              rm -rf "$output_path"
              echo "Existing output erased"
            else
              echo "Invalid output path"
              exit 1
            fi
          fi

          mkdir -p "$output_path"
          
          if [ "${{ inputs.deploy-as-hub }}" = "false" ]; then
            cp manifest/manifest.json output-repository/$repo_name/manifest.json
          else
            cp manifest/manifest.json output-repository/hub/manifest.json
          fi

          cp -a generated-docs/* "$output_path/"

      - run: |
          cd output-repository
          git add .
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Update generated docs for $GITHUB_REPOSITORY"
          
          git pull --rebase origin ${{ inputs.output-branch }} || echo "No changes to pull"
          git push origin ${{ inputs.output-branch }}