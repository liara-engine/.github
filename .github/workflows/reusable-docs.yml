name: reusable-docs

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string

      output-repository:
        required: true
        type: string

      output-branch:
        required: false
        type: string
        default: gh-pages

      # Generally `dev` or `X.Y.Z`
      deployment-version:
        required: false
        type: string
        default: generated-docs

      erase-existing-output:
        required: false
        type: boolean
        default: false

    secrets:
      ghcr-token:
        required: true

      push-token:
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr-token }}

      - run: docker pull ${{ inputs.image }}

      - run: mkdir -p generated-docs

      - run: |
          docker run --rm \
            -v ${{ github.workspace }}:/src \
            -v ${{ github.workspace }}/generated-docs:/docs \
            ${{ inputs.image }}

      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: generated-docs

  publish:
    needs: build

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    concurrency:
      group: docs-publish-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.output-repository }}
          ref: ${{ inputs.output-branch }}
          token: ${{ secrets.push-token }}
          path: output-repository

      - uses: actions/download-artifact@v4
        with:
          name: docs
          path: generated-docs

      - run: |
          repo_name=$(basename $GITHUB_REPOSITORY)
          output_path=output-repository/$repo_name/${{ inputs.deployment-version }}
          
          echo "Publishing docs to: $output_path"
          
          if [ -d "$output_path" ] && [ "${{ inputs.erase-existing-output }}" = "true" ]; then
            if [[ "$output_path" == output-repository/* ]]; then
              rm -rf "$output_path"
              echo "Existing output erased"
            else
              echo "Invalid output path"
              exit 1
            fi
          fi
          
          mkdir -p "$output_path"
          cp -a generated-docs/* "$output_path/"

      - run: |
          cd output-repository
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Update generated docs for $GITHUB_REPOSITORY"
          
          git pull --rebase origin ${{ inputs.output-branch }} || echo "No changes to pull"
          git push origin ${{ inputs.output-branch }}