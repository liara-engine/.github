name: reusable-docs-preview-cleanup

on:
  workflow_call:
    inputs:
      output-repository:
        required: true
        type: string
      output-branch:
        required: false
        type: string
        default: cloudflare-pages
      docs-shared-ref:
        required: false
        type: string
        default: main

    secrets:
      push-token:
        required: true
      read-token:
        required: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    concurrency:
      group: docs-publish-${{ inputs.output-repository }}-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.output-repository }}
          ref: ${{ inputs.output-branch }}
          token: ${{ secrets.push-token }}
          path: output-repository
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: '${{ github.repository_owner }}/.github'
          sparse-checkout: |
            scripts
            .github/actions
          path: '.github-shared-core'

      - name: Remove the preview
        id: remove
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY##*/}"
          target="output-repository/site/${repo}/pr-${{ github.event.number }}"

          if [ ! -d "$target" ]; then
            echo "No preview at $target."
            echo "removed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -rf "$target"
          echo "removed=true" >> "$GITHUB_OUTPUT"
          echo "Removed $target."

      - if: steps.remove.outputs.removed == 'true'
        uses: ./.github-shared-core/.github/actions/site-refresh
        with:
          site: output-repository/site
          docs-shared-ref: ${{ inputs.docs-shared-ref }}
          collect-garbage: 'true'
          token: ${{ secrets.read-token }}

      - if: steps.remove.outputs.removed == 'true'
        run: |
          bash .github-shared-core/scripts/git-publish.sh \
            --repo-dir output-repository \
            --branch "${{ inputs.output-branch }}" \
            --message "docs: remove preview pr-${{ github.event.number }} for $GITHUB_REPOSITORY" \
            --generated site/registry-index.json \
            --regenerate "$LIARA_INDEX_COMMAND"
