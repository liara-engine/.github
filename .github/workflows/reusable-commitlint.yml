name: commitlint

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '24'
      commitlint-version:
        type: string
        required: false
        default: '21'

jobs:
  commitlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - run: |
          npm install --no-save --no-audit --no-fund \
            "@commitlint/cli@${{ inputs.commitlint-version }}" \
            "@commitlint/config-conventional@${{ inputs.commitlint-version }}"

      - run: |
          if compgen -G "commitlint.config.*" > /dev/null \
             || compgen -G ".commitlintrc*" > /dev/null \
             || node -e "const p=require('./package.json'); process.exit(p.commitlint ? 0 : 1)" 2>/dev/null; then
            echo "Commitlint config found."
          else
            echo "Error: No commitlint config found in the repository. Please add a commitlint configuration file (commitlint.config.js, .commitlintrc.json, etc.) or a 'commitlint' field in package.json."
            exit 1
          fi

      - id: lint
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REPORT="commitlint-report.md"

          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "pull_request_target" ]]; then
            mapfile -t COMMITS < <(git rev-list --no-merges --reverse "${BASE_SHA}..${HEAD_SHA}")
          else
            COMMITS=("$PUSH_SHA")
          fi

          TOTAL=${#COMMITS[@]}
          FAILED=0

          {
            echo "## Commitlint"
            echo ""
          } > "$REPORT"

          if [[ $TOTAL -eq 0 ]]; then
            echo "No commits to lint." >> "$REPORT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for sha in "${COMMITS[@]}"; do
            SHORT=$(git log -1 --format='%h' "$sha")
            SUBJECT=$(git log -1 --format='%s' "$sha")
            SUBJECT=${SUBJECT//\`/}

            set +e
            OUTPUT=$(git log -1 --format='%B' "$sha" | npx commitlint --color=false 2>&1)
            CODE=$?
            set -e

            if [[ $CODE -ne 0 ]]; then
              FAILED=$((FAILED + 1))
              {
                echo "### \`$SHORT\` — $SUBJECT"
                echo ""
                echo '```'
                echo "$OUTPUT"
                echo '```'
                echo ""
              } >> "$REPORT"
              echo "::error::Commit $SHORT invalid : $SUBJECT"
            fi
          done

          if [[ $FAILED -eq 0 ]]; then
            {
              echo "**All $TOTAL commit(s) respect the commitlint convention.**"
            } >> "$REPORT"
          else
            sed -i "2a **$FAILED commit(s) don't respect the commitlint convention.**" "$REPORT"
          fi

          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - if: >-
          always() &&
          steps.lint.outcome != 'skipped' &&
          (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: commitlint-report.md
          header: 'commitlint'

      - if: steps.lint.outputs.failed != '0'
        run: |
          echo "::error::${{ steps.lint.outputs.failed }} commit(s) don't respect the commitlint convention."
          echo "Please fix these errors before merging the pull request."
          exit 1
