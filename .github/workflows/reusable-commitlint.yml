name: commitlint

on:
  workflow_call:

jobs:
  commitlint:

    permissions:
      pull-requests: write

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install -g @commitlint/cli @commitlint/config-conventional

      - id: commitlint
        run: |
          set +e
          commitlint \
            --color=false \
            --format=json \
            --from=origin/${{ github.base_ref }} \
            --to=${{ github.sha }} > commitlint.json
          EXIT_CODE=$?
          set -e

          node <<'EOF'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('commitlint.json'));
          let md = '';

          if (result.valid) {
            md += '## Commitlint passed\n\n';
            md += 'All commit messages follow the Conventional Commits specification.\n';
          } else {
            md += '## Commitlint failed\n\n';
            for (const commit of result.results) {
              if (commit.valid) continue;
              md += `### \`${commit.input.split('\n')[0]}\`\n\n`;
              for (const error of commit.errors) {
                md += `- ❌ \`${error.name}\` — ${error.message}\n`;
              }
              md += '\n';
            }
          }

          fs.writeFileSync('comment.md', md);
          EOF

          echo "exit_code=$EXIT_CODE" >> $GITHUB_ENV

      - if: env.exit_code == '0'
        run: |
          echo "## Commit Lint Results" > comment.md
          echo "" >> comment.md
          echo "Everything looks good! No commit message errors found." >> comment.md

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: comment.md
          header: 'commitlint'

      - if: env.exit_code != '0'
        run: |
          echo "Commit message errors found. Please check the comment above for details."
          exit 1
