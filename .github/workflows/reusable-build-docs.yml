name: reusable-build-docs

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string

      additional-dir-to-deploy:
        required: false
        type: string
        default: ""

    secrets:
      ghcr-token:
        required: true

      push-token:
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker pull ${{ inputs.image }}

      - run: mkdir -p generated-docs

      - run: |
          docker run --rm \
            -v ${{ github.workspace }}:/src \
            -v ${{ github.workspace }}/generated-docs:/docs \
            -e ADDITIONAL_DIRECTORIES_TO_OUTPUT="${{ inputs.additional-dir-to-deploy }}" \
            ${{ inputs.image }}

      - run: |
          if [ -f "generated-docs/manifest.json" ]; then
            mv generated-docs/manifest.json manifest.json
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: generated-docs