name: reusable-docs-preview

# A pull request's documentation, published to a hidden path that only a
# direct link reaches: `pr-<n>` is excluded from the navigation index by
# construction (tools/build-registry-index.py) and never becomes anybody's
# `latest`, because the deploy is told not to touch the canonical manifest.

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      output-repository:
        required: true
        type: string
      output-branch:
        required: false
        type: string
        default: cloudflare-pages
      base-url:
        required: false
        type: string
        default: https://liara-engine.liara-engine-documentation.workers.dev
      source-path:
        required: false
        type: string
        default: '.'
      skip-api:
        required: false
        type: boolean
        default: false
      docs-shared-ref:
        required: false
        type: string
        default: main

    secrets:
      ghcr-token:
        required: false
      push-token:
        required: true
      read-token:
        required: false

jobs:
  build:
    permissions:
      contents: read
      packages: read
    uses: liara-engine/.github/.github/workflows/reusable-build-docs.yml@v2
    with:
      image: ${{ inputs.image }}
      version: pr-${{ github.event.number }}
      source-path: ${{ inputs.source-path }}
      site: ${{ inputs.base-url }}
      skip-api: ${{ inputs.skip-api }}
    secrets:
      ghcr-token: ${{ secrets.ghcr-token }}
      read-token: ${{ secrets.read-token }}

  publish:
    needs: build
    permissions:
      contents: read
    uses: liara-engine/.github/.github/workflows/reusable-deploy-docs.yml@v2
    with:
      output-repository: ${{ inputs.output-repository }}
      output-branch: ${{ inputs.output-branch }}
      update-manifest: never
      docs-shared-ref: ${{ inputs.docs-shared-ref }}
    secrets:
      ghcr-token: ${{ secrets.ghcr-token }}
      push-token: ${{ secrets.push-token }}
      read-token: ${{ secrets.read-token }}

  comment:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: docs-preview
          message: |
            **Documentation preview** for this PR:

            ${{ inputs.base-url }}/${{ needs.build.outputs.repo }}/pr-${{ github.event.number }}/

            <sub>Rebuilt on every push · removed automatically when the PR closes.</sub>
