name: reusable-generate-docker

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      image-name:
        required: true
        type: string
      image-tag:
        required: false
        type: string
        default: latest
      dockerfile-path:
        required: false
        type: string
        default: Dockerfile

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile-path }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ inputs.image-name }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ inputs.image-name }}:cache,mode=max