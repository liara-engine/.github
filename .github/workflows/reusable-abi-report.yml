name: reusable-abi-report

on:
  workflow_call:
    inputs:
      github-repo-version:
        description: 'Ref of the org .github repository to pull the shared script from.'
        required: false
        type: string
        default: 'main'

jobs:
  report:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout shared .github repository
        uses: actions/checkout@v7
        with:
          repository: '${{ github.repository_owner }}/.github'
          ref: '${{ inputs.github-repo-version }}'
          path: '.github-shared-core'

      - name: Download step reports
        uses: actions/download-artifact@v8
        with:
          pattern: 'abi-step-*'
          path: 'reports'
        continue-on-error: true

      - name: Render comment body
        run: |
          python3 .github-shared-core/scripts/abi_report.py \
            --reports-dir reports \
            --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            --output comment.md

      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: abi-pipeline
          path: comment.md