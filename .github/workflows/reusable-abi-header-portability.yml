name: reusable-abi-header-portability

# Step 1 of the ABI pipeline: every public header must compile standalone,
# warning-free, as both C and C++, across several language standards.
# See docs/INTERFACES.md sections 2 and 11.
#
# Reporting contract (consumed by reusable-abi-report.yml): each matrix leg
# uploads an artifact `abi-step-01-header-portability-<leg>` containing
# `meta.json` (order/step/leg/status) and `log.txt` (captured output).

on:
  workflow_call:
    inputs:
      include-dir:
        description: 'Root directory holding the public headers, relative to the caller repo.'
        required: false
        type: string
        default: 'include'

      c-standards:
        description: 'Semicolon-separated C standards each header is checked against.'
        required: false
        type: string
        default: '11;17;23'

      cxx-standards:
        description: 'Semicolon-separated C++ standards each header is checked against.'
        required: false
        type: string
        default: '17;20;23'

      run-configure:
        description: 'Run a CMake configure first (needed when headers are generated, e.g. version_config.h).'
        required: false
        type: boolean
        default: true

      configure-options:
        description: 'Extra -D options passed to the pre-check CMake configure.'
        required: false
        type: string
        default: '-D LIARA_INTERFACES_BUILD_TESTS=OFF -D LIARA_INTERFACES_INSTALL=OFF'

      github-repo-version:
        description: 'Ref of the org .github repository to pull the shared script from.'
        required: false
        type: string
        default: 'main'

jobs:
  header-portability:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc,   cc: gcc-14,   cxx: g++-14,     packages: 'gcc-14 g++-14' }
          - { name: clang, cc: clang-18, cxx: clang++-18, packages: 'clang-18' }

    name: headers (${{ matrix.name }})

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: '${{ github.repository_owner }}/.github'
          ref: '${{ inputs.github-repo-version }}'
          path: '.github-shared-core'

      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - if: ${{ inputs.run-configure }}
        run: |
          cmake -S . -B build/_portability_config ${{ inputs.configure-options }}

      # set +e so a portability failure does not abort the step: we still want
      # to capture the log and upload the report fragment. The job is marked
      # failed by the final step below.
      - id: check
        run: |
          set +e
          python3 .github-shared-core/scripts/abi_header_portability.py \
            --include-dir '${{ inputs.include-dir }}' \
            --cc '${{ matrix.cc }}' \
            --cxx '${{ matrix.cxx }}' \
            --c-standards '${{ inputs.c-standards }}' \
            --cxx-standards '${{ inputs.cxx-standards }}' \
            2>&1 | tee portability.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Prepare report fragment
        if: always()
        run: |
          mkdir -p report
          cp portability.log report/log.txt 2>/dev/null || echo "(no log captured)" > report/log.txt
          status="success"
          [ "${{ steps.check.outputs.status }}" != "0" ] && status="failure"
          cat > report/meta.json << EOF
          {"order": 1, "step": "Header portability", "leg": "${{ matrix.name }} (${{ matrix.cc }} / ${{ matrix.cxx }})", "status": "$status"}
          EOF

      - name: Upload report fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abi-step-01-header-portability-${{ matrix.name }}
          path: report/
          retention-days: 1

      - if: ${{ steps.check.outputs.status != '0' }}
        run: exit 1
