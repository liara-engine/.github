name: reusable-abi-snapshot

on:
  workflow_call:
    inputs:
      include-dir:
        required: false
        type: string
        default: 'include'
      std:
        required: false
        type: string
        default: 'c++20'
      clang-package:
        required: false
        type: string
        default: 'clang-18'
      libclang-version:
        required: false
        type: string
        default: '18.1.1'
      run-configure:
        required: false
        type: boolean
        default: true
      configure-options:
        required: false
        type: string
        default: '-D LIARA_INTERFACES_BUILD_TESTS=OFF -D LIARA_INTERFACES_INSTALL=OFF'
      github-repo-version:
        required: false
        type: string
        default: 'main'

jobs:
  snapshot:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}

    steps:
      - uses: actions/checkout@v7

      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/checkout@v7
        with:
          repository: '${{ github.repository_owner }}/.github'
          ref: '${{ inputs.github-repo-version }}'
          sparse-checkout: 'scripts/'
          path: '.github-shared-core'

      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ inputs.clang-package }}
          python3 -m pip install --break-system-packages "libclang==${{ inputs.libclang-version }}"

      - if: ${{ inputs.run-configure }}
        run: cmake -S . -B build/_snap ${{ inputs.configure-options }}

      - if: ${{ inputs.run-configure && github.event_name == 'pull_request' }}
        run: cmake -S base -B base/build/_snap ${{ inputs.configure-options }}

      - run: |
          python3 .github-shared-core/scripts/abi_snapshot.py generate \
            --include-dir '${{ inputs.include-dir }}' \
            --include-extra build/_snap/generated \
            --std '${{ inputs.std }}' \
            --clang '${{ inputs.clang-package }}' \
            --output abi-head.json

      - if: ${{ github.event_name == 'pull_request' }}
        id: diff
        run: |
          set +e
          {
            python3 .github-shared-core/scripts/abi_snapshot.py generate \
              --include-dir 'base/${{ inputs.include-dir }}' \
              --include-extra base/build/_snap/generated \
              --std '${{ inputs.std }}' \
              --clang '${{ inputs.clang-package }}' \
              --output abi-base.json \
            && python3 .github-shared-core/scripts/abi_snapshot.py diff \
              --old abi-base.json --new abi-head.json \
              --summary-out required-bump.txt
            echo "$?" > rc.txt
          } 2>&1 | tee abi-diff.log
          echo "status=$(cat rc.txt)" >> "$GITHUB_OUTPUT"
          echo "required=$(cat required-bump.txt 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - if: ${{ github.event_name == 'pull_request' }}
        id: guard
        run: |
          set +e
          printf '%s' "$PR_BODY" > pr-body.txt
          python3 .github-shared-core/scripts/abi_version_guard.py \
            --required '${{ steps.diff.outputs.required }}' \
            --title "$PR_TITLE" \
            --body-file pr-body.txt \
            2>&1 | tee version-guard.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - if: always()
        shell: bash
        env:
          LEG: 'base...head (required: ${{ steps.diff.outputs.required || "none" }})'
        run: |
          .github-shared-core/scripts/report_fragment.sh \
            --section 3 --section-name 'ABI Rules' \
            --step 4 --step-name 'ABI diff' \
            --leg "$LEG" \
            --status '${{ steps.check.outputs.status }}' \
            --log abi-diff.log \
            --out "ci-report-abi-diff"

      - if: always()
        shell: bash
        env:
          LEG: 'conventional commit (PR title)'
        run: |
          .github-shared-core/scripts/report_fragment.sh \
            --section 3 --section-name 'ABI Rules' \
            --step 5 --step-name 'Version-bump guard' \
            --leg "$LEG" \
            --status '${{ steps.guard.outputs.status }}' \
            --log version-guard.log \
            --out "ci-report-version-guard"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-report-abi-diff
          path: ci-report-abi-diff/
          retention-days: 1

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-report-version-guard
          path: ci-report-version-guard/
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: abi-snapshot
          path: abi-head.json
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

      - if: >-
          ${{ github.event_name == 'pull_request' &&
              (steps.diff.outputs.status != '0' || steps.guard.outputs.status != '0') }}
        run: exit 1
