name: reusable-abi-layout-freeze

# Freeze struct layout. A committed, generated golden header
# (abi_layout_asserts.py) holds static_assert checks on
# sizeof/alignof/offsetof for every public POD struct.
#
#   layout-check    (libclang) regenerates in memory and compares to the
#                   committed golden -> catches structs added/removed/changed
#                   without regenerating.
#   layout-compile  (matrix) compiles the golden asserts as C and C++ across
#                   standards/compilers -> catches layout drift and any
#                   cross-platform divergence.

on:
  workflow_call:
    inputs:
      include-dir:
        required: false
        type: string
        default: 'include'
      golden-header:
        description: 'Path to the committed generated layout-assert header.'
        required: false
        type: string
        default: 'tests/abi/abi_layout.generated.h'
      c-standards:
        required: false
        type: string
        default: '11;17;23'
      cxx-standards:
        required: false
        type: string
        default: '17;20;23'
      clang-package:
        required: false
        type: string
        default: 'clang-18'
      libclang-version:
        required: false
        type: string
        default: '18.1.1'
      run-configure:
        required: false
        type: boolean
        default: true
      configure-options:
        required: false
        type: string
        default: '-D LIARA_INTERFACES_BUILD_TESTS=OFF -D LIARA_INTERFACES_INSTALL=OFF'
      github-repo-version:
        required: false
        type: string
        default: 'main'

jobs:
  layout-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: '${{ github.repository_owner }}/.github'
          ref: '${{ inputs.github-repo-version }}'
          sparse-checkout: 'scripts/'
          path: '.github-shared-core'

      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ inputs.clang-package }}
          python3 -m pip install --break-system-packages "libclang==${{ inputs.libclang-version }}"

      - if: ${{ inputs.run-configure }}
        run: cmake -S . -B build/_layout_config ${{ inputs.configure-options }}

      - id: check
        run: |
          set +e
          python3 .github-shared-core/scripts/abi_layout_asserts.py \
            --include-dir '${{ inputs.include-dir }}' \
            --include-extra build/_layout_config/generated \
            --output '${{ inputs.golden-header }}' \
            --clang '${{ inputs.clang-package }}' \
            --check \
            2>&1 | tee layout-check.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - if: always()
        shell: bash
        env:
          LEG: 'completeness (libclang)'
        run: |
          bash .github-shared-core/scripts/report_fragment.sh \
            --section 3 --section-name 'ABI Rules' \
            --step 3 --step-name 'Layout freeze check' \
            --leg "$LEG" \
            --status '${{ steps.check.outputs.status }}' \
            --log layout-check.log \
            --out "ci-report-layout-freeze-check"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-report-layout-freeze-check
          path: ci-report-layout-freeze-check/
          retention-days: 1

      - if: ${{ steps.check.outputs.status != '0' }}
        run: exit 1

  layout-compile:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc,   os: ubuntu-24.04,   cc: gcc-14,   cxx: g++-14,     packages: 'gcc-14 g++-14', is_msvc: false }
          - { name: clang, os: ubuntu-24.04,   cc: clang-18, cxx: clang++-18, packages: 'clang-18',      is_msvc: false }
          - { name: msvc,  os: windows-latest, cc: cl,       cxx: cl,         packages: '',              is_msvc: true }
    name: layout-compile (${{ matrix.name }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - if: ${{ !matrix.is_msvc }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - if: ${{ matrix.is_msvc }}
        uses: ilammy/msvc-dev-cmd@v1

      - if: ${{ inputs.run-configure }}
        run: cmake -S . -B build/_layout_config ${{ inputs.configure-options }}

      - id: check
        run: |
          set +e
          printf '#include "%s"\n' "${{ inputs.golden-header }}" > layout_tu.src
          {
            rc=0
            if [ "${{ matrix.is_msvc }}" = "true" ]; then
              for std in $(echo '${{ inputs.c-standards }}' | tr ';' ' '); do
                if [ "$std" = "11" ] || [ "$std" = "17" ]; then
                  echo "== C (MSVC) c$std =="
                  cl.exe -TC -std:c$std -Zs -WX -W4 -I"${{ inputs.include-dir }}" layout_tu.src || rc=1
                fi
              done
              for std in $(echo '${{ inputs.cxx-standards }}' | tr ';' ' '); do
                std_flag="c++$std"
                if [ "$std" = "23" ]; then std_flag="c++latest"; fi
                echo "== C++ (MSVC) $std_flag =="
                cl.exe -TP -std:$std_flag -Zs -WX -W4 -I"${{ inputs.include-dir }}" layout_tu.src || rc=1
              done
            else
              for std in $(echo '${{ inputs.c-standards }}' | tr ';' ' '); do
                echo "== C c$std =="
                ${{ matrix.cc }} -x c -std=c$std -fsyntax-only \
                  -Wall -Wextra -Wpedantic -Werror \
                  -I. -I '${{ inputs.include-dir }}' layout_tu.src || rc=1
              done
              for std in $(echo '${{ inputs.cxx-standards }}' | tr ';' ' '); do
                echo "== C++ c++$std =="
                ${{ matrix.cxx }} -x c++ -std=c++$std -fsyntax-only \
                  -Wall -Wextra -Wpedantic -Werror \
                  -I. -I '${{ inputs.include-dir }}' layout_tu.src || rc=1
              done
            fi
            echo "$rc" > rc.txt
          } 2>&1 | tee layout-compile.log
          echo "status=$(cat rc.txt)" >> "$GITHUB_OUTPUT"

      - if: always()
        uses: actions/checkout@v7
        with:
          repository: '${{ github.repository_owner }}/.github'
          ref: '${{ inputs.github-repo-version }}'
          sparse-checkout: 'scripts/'
          path: '.github-shared-core'

      - if: always()
        shell: bash
        env:
          LEG: '${{ matrix.name }} (${{ matrix.cc }} / ${{ matrix.cxx }})'
        run: |
          bash .github-shared-core/scripts/report_fragment.sh \
            --section 3 --section-name 'ABI Rules' \
            --step 3 --step-name 'Layout freeze compile' \
            --leg "$LEG" \
            --status '${{ steps.check.outputs.status }}' \
            --log layout-compile.log \
            --out "ci-report-layout-freeze-compile-${{ matrix.name }}"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-report-layout-freeze-compile-${{ matrix.name }}
          path: ci-report-layout-freeze-compile-${{ matrix.name }}/
          retention-days: 1

      - if: ${{ steps.check.outputs.status != '0' }}
        run: exit 1
